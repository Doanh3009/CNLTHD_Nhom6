name: TechShop CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B test

      - name: Package backend services
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend test, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techshop-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: techshop-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: api-gateway/Dockerfile
            context: .
          - image: auth-service
            dockerfile: auth-service/Dockerfile
            context: .
          - image: chatbot-service
            dockerfile: chatbot-service/Dockerfile
            context: .
          - image: discovery-server
            dockerfile: discovery-server/Dockerfile
            context: .
          - image: inventory-service
            dockerfile: inventory-service/Dockerfile
            context: .
          - image: notification-service
            dockerfile: notification-service/Dockerfile
            context: .
          - image: order-service
            dockerfile: order-service/Dockerfile
            context: .
          - image: product-service
            dockerfile: product-service/Dockerfile
            context: .
          - image: techshop-frontend
            dockerfile: techshop-frontend/Dockerfile
            context: techshop-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image namespace
        id: image
        shell: bash
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "namespace=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=microservices-tutorial" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ steps.image.outputs.namespace }}/${{ matrix.image }}:${{ github.sha }}
            ${{ steps.image.outputs.namespace }}/${{ matrix.image }}:latest

  deploy:
    name: Deploy Kubernetes manifests
    runs-on: ubuntu-latest
    needs: [docker-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config

      - name: Apply manifests
        if: env.KUBE_CONFIG != ''
        run: kubectl apply -R -f k8s/

      - name: Skip deploy without cluster secret
        if: env.KUBE_CONFIG == ''
        run: echo "KUBE_CONFIG is not configured; build and test completed."
