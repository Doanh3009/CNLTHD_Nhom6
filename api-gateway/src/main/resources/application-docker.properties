server.port=8080
eureka.client.serviceUrl.defaultZone=http://eureka:password@discovery-server:8761/eureka
spring.security.oauth2.resourceserver.jwt.issuer-uri= http://keycloak:8080/realms/spring-boot-microservices-realm
management.zipkin.tracing.endpoint=http://zipkin:9411
app.eureka-server=discovery-server

spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=http://product-service:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/product,/api/product/**,/api/category,/api/category/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=http://order-service:8080
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/order,/api/order/**

spring.cloud.gateway.routes[2].id=discovery-server
spring.cloud.gateway.routes[2].uri=http://${app.eureka-server}:8761
spring.cloud.gateway.routes[2].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[2].filters[0]=SetPath=/

spring.cloud.gateway.routes[3].id=discovery-server-static
spring.cloud.gateway.routes[3].uri=http://${app.eureka-server}:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/**

spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=http://auth-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[5].id=chatbot-service
spring.cloud.gateway.routes[5].uri=http://chatbot-service:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/chatbot/**

spring.cloud.gateway.routes[6].id=inventory-service
spring.cloud.gateway.routes[6].uri=http://inventory-service:8080
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/inventory,/api/inventory/**
